    // BAĞIMSIZLIK: storage v3+ varsa kalıcı, yoksa RAM-only Set.
    // KULLANIM: const dup = await Modules.replayGuard.check(hash);
    //          if (dup) { /* önceden işlendi */ }
    //          await Modules.replayGuard.mark(hash, { examId, ts });
    // ═══════════════════════════════════════════════
    Modules.replayGuard = (() => {
      const STORE = 'processedHashes';
      const TTL_MS = 7 * 24 * 60 * 60 * 1000; // 7 gün sonra hash unutulur
      const ramCache = new Map(); // fallback: hash -> {ts, meta}

      function storageReady() {
        try {
          const db = Modules.storage && Modules.storage.getDb && Modules.storage.getDb();
          return db && db.objectStoreNames.contains(STORE);
        } catch { return false; }
      }

      async function check(hash) {
        if (!hash) return null;
        // 1) RAM önbellek
        if (ramCache.has(hash)) {
          const rec = ramCache.get(hash);
          if (Date.now() - rec.ts < TTL_MS) return rec;
          ramCache.delete(hash);
        }
        // 2) DB
        if (!storageReady()) return null;
        try {
          const rec = await Modules.storage.get(STORE, hash);
          if (!rec) return null;
          if (Date.now() - (rec.ts || 0) > TTL_MS) {
            // Süresi geçmiş → temizle
            try { await Modules.storage.del(STORE, hash); } catch {}
            return null;
          }
          ramCache.set(hash, rec);
          return rec;
        } catch { return null; }
      }

      async function mark(hash, meta = {}) {
        if (!hash) return false;
        const rec = { hash, ts: Date.now(), ...meta };
        ramCache.set(hash, rec);
        if (!storageReady()) return false;
        try { await Modules.storage.put(STORE, rec); return true; }
        catch { return false; }
      }

      async function forget(hash) {
        ramCache.delete(hash);
        if (!storageReady()) return false;
        try { await Modules.storage.del(STORE, hash); return true; } catch { return false; }
      }

      Modules.registry.push('replayGuard'); Modules.health.replayGuard = true;
      return Object.freeze({ check, mark, forget });
    })();


    // ═══════════════════════════════════════════════
    // 26. DIAGNOSTICS (Saha Testi Dump'ı)
    // ───────────────────────────────────────────────
    // AMAÇ: Öğretmenin telefonundan tek tıkla sistem durumu dökümü al.
    //       Telemetry özetleri + cache stats + health + son log'lar.
    //       JSON olarak panoya kopyala veya download.
    // BAĞIMSIZLIK: Diğer modüller varsa onları okur, yoksa boş döner.
    // KULLANIM: const report = await Modules.diagnostics.snapshot();
    //          await Modules.diagnostics.downloadReport();
    // ═══════════════════════════════════════════════
    Modules.diagnostics = (() => {
      async function snapshot() {
        const out = {
          version: (Modules.config && Modules.config.get) ? Modules.config.get('VERSION') : '?',
          ts: new Date().toISOString(),
          ua: typeof navigator !== 'undefined' ? (navigator.userAgent || '').slice(0, 300) : '',
          online: typeof navigator !== 'undefined' ? !!navigator.onLine : false,
          health: { ...Modules.health },
          registry: [...Modules.registry]
        };
        if (Modules.telemetry) {
          try { out.telemetry = Modules.telemetry.summary(); out.session = Modules.telemetry.getSessionId(); } catch {}
        }
        if (Modules.cacheJanitor) {
          try { out.cacheStats = await Modules.cacheJanitor.stats(); } catch {}
        }
        if (Modules.state && Modules.state.get) {
          try { out.metrics = Modules.state.get('metrics'); } catch {}
        }
        if (Modules.logger && Modules.logger.getHistory) {
          try { out.recentLogs = Modules.logger.getHistory().slice(-50); } catch {}
        }
        if (Modules.migration) {
          try { out.migrations = Modules.migration.list(); out.targetDbVersion = Modules.migration.TARGET_VERSION; } catch {}
        }
        return out;
      }

      async function downloadReport() {
        const report = await snapshot();
        const json = JSON.stringify(report, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `maarif-diag-${Date.now()}.json`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        return report;
      }

      async function copyToClipboard() {
        const report = await snapshot();
        const json = JSON.stringify(report, null, 2);
        try { await navigator.clipboard.writeText(json); return true; }
        catch { return false; }
      }

      Modules.registry.push('diagnostics'); Modules.health.diagnostics = true;
      return Object.freeze({ snapshot, downloadReport, copyToClipboard });
    })();


    // ═══════════════════════════════════════════════
    // 27. CAPTURE FRAME (Auto-capture Visual Guide)
    // ───────────────────────────────────────────────
    // AMAÇ: Kameranın üzerine yeşil/kırmızı rehber çerçeve çiz.
    //       captureGuide metriklerini görsel hâle getirir.
    //       Tam ekran <video> üzerine yerleştirilir.
    // BAĞIMSIZLIK: captureGuide varsa onun durumunu okur, yoksa pasif.
    // KULLANIM: const stop = Modules.captureFrame.attach(videoEl);
    //          // sonra: stop();
    // NOT: Auto-shutter (otomatik çekim) opsiyoneldir; saha verisi olmadan
    //      eşik karar veremeyiz. Şu an MANUEL — sadece renk değişir.
    // ═══════════════════════════════════════════════
    Modules.captureFrame = (() => {
      function ensureStyle() {
        if (document.getElementById('capture-frame-style')) return;
        const st = document.createElement('style');
        st.id = 'capture-frame-style';
        st.textContent = `
          .capture-frame-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 9996; }
          .capture-frame-overlay svg { width: 100%; height: 100%; display: block; }
          .capture-frame-overlay rect { fill: none; stroke-width: 4; transition: stroke 0.3s, stroke-dasharray 0.3s; }
          .capture-frame-overlay.ok rect    { stroke: #10b981; stroke-dasharray: 0; }
          .capture-frame-overlay.warn rect  { stroke: #f59e0b; stroke-dasharray: 8 4; }
          .capture-frame-overlay.scan rect  { stroke: #94a3b8; stroke-dasharray: 4 4; }
        `;
        document.head.appendChild(st);
      }

      // Wraps video in a relative-positioned container and adds the overlay
      function attach(videoEl) {
        if (!videoEl) return () => {};
        ensureStyle();

        // Eğer parent relative değilse, geçici yap
        const parent = videoEl.parentElement;
        if (!parent) return () => {};
        const prevPosition = parent.style.position;
        if (getComputedStyle(parent).position === 'static') parent.style.position = 'relative';

        // Overlay oluştur
        const ov = document.createElement('div');
        ov.className = 'capture-frame-overlay scan';
        ov.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="6" y="6" width="88" height="88" rx="2" ry="2"/></svg>';
        parent.appendChild(ov);

        // captureGuide durumunu canlı dinle (varsa)
        let stopped = false;
        const tick = () => {
          if (stopped) return;
          // captureGuide'in son judgment'ını "DOM hint elemanından" oku
          const hint = document.getElementById('capture-hint');
          if (hint && hint.classList.contains('show')) {
            if (hint.classList.contains('ok')) {
              ov.className = 'capture-frame-overlay ok';
            } else {
              ov.className = 'capture-frame-overlay warn';
            }
          } else {
            ov.className = 'capture-frame-overlay scan';
          }
          requestAnimationFrame(() => setTimeout(tick, 200));
        };
        tick();

        return () => {
          stopped = true;
          if (ov.parentNode) ov.parentNode.removeChild(ov);
          if (parent && !prevPosition) parent.style.position = '';
        };
      }

      Modules.registry.push('captureFrame'); Modules.health.captureFrame = true;
      return Object.freeze({ attach });
    })();


    // ═══════════════════════════════════════════════════════════════════
    // ★★★ YENİ BLOKLAR SON ★★★
    // ═══════════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════════


    // ═══════════════════════════════════════════════
    // APP BOOTSTRAPPER (Ana Başlatıcı Motor)
    // ═══════════════════════════════════════════════
    Modules.app = (() => {
      let booted = false;
      window.addEventListener('error', e => Modules.logger.error('Global Error:', e.message));
      window.addEventListener('unhandledrejection', e => Modules.logger.error('Unhandled Promise:', e.reason));

      function showFatalError(title, errMessage) {
        const safeMsg = Modules.utils.escapeHTML(errMessage);
        document.body.innerHTML = `<div class="fatal-error"><h3>🚨 ${title}</h3><p>${safeMsg}</p><button style="background:#fca5a5; border:none; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="location.reload()">Yeniden Dene</button></div>`;
      }

      async function init() {
        if (booted) return;
        const t0 = performance.now(); 
        
        try {
          booted = true;
          Modules.logger.info(`🚀 Booting [${navigator.onLine ? 'Online' : 'Offline'}]...`);

          const pStorage = Promise.race([Modules.storage.init(), Modules.utils.timeout(5000)]);
          const pUI = Modules.ui.init();
          await Promise.all([pStorage, pUI]);
          Modules.state.patch('bootState', { storage: true, ui: true });

          Modules.queue.restore().then(() => Modules.state.patch('bootState', { queue: true })).catch(err => Modules.logger.warn('Queue Hatası:', err.message));
          Modules.state.set('initialized', true); Modules.eventBus.emit('app:interactive');

          // CLEANUP v1.7.2: Boot sonrası background servisler (blocklayıcı değil)
          if (Modules.telemetry) Modules.telemetry.start();
          if (Modules.cacheJanitor) Modules.cacheJanitor.schedule();

          if(Modules.ui.els.title) {
            Modules.ui.els.title.innerText = "Maarif Asistanı Operasyonel!";
            Modules.ui.els.title.style.color = "var(--success)";
            setTimeout(() => { Modules.eventBus.emit('ui:toast', { msg: 'FAZ 4 Motoru Aktif. Saha testine hazır.', type: 'success' }); }, 500);
          }
          Modules.logger.info(`✅ Sistem ${Math.round(performance.now() - t0)}ms içinde hazır. Engine V1.7.2`);

        } catch (err) {
          booted = false; Modules.logger.error(err.stack || err); showFatalError('Sistem Başlatılamadı', err.message);
        }
      }
      Modules.registry.push('app'); Modules.health.app = true;
      return Object.freeze({ init });
    })();

    // SİSTEMİ ATEŞLE
    document.addEventListener('DOMContentLoaded', () => { Modules.app.init(); });
  </script>
