<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0e">
<title>Maarif · Dijital Öğretmen Asistanı v0.8.0</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   🎨 CSS STYLES (v0.7.2 Geliştirilmiş Versiyon)
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0a0b0e; --bg-1: #11141a; --bg-2: #161a23; --bg-3: #1c2230;
  --line: rgba(255,255,255,0.06); --line-2: rgba(255,255,255,0.10);
  --text: #f0f3f8; --text-2: #9ba3b4; --text-3: #5d6678;
  --teal: #14b8a6; --amber: #f59e0b; --rose: #f43f5e; --indigo: #6366f1; --emerald: #10b981;
  --r-sm: 10px; --r: 14px; --r-lg: 20px;
  --font: 'Inter', system-ui, sans-serif; --font-display: 'Plus Jakarta Sans', var(--font);
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); position: relative; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

/* Ekran Geçişleri */
.screen { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--bg); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; z-index: 10; }
.screen.active { transform: translateX(0); z-index: 20; }
.screen.previous { transform: translateX(-20%); opacity: 0.5; }

/* Bileşenler */
.topbar { position: sticky; top: 0; background: rgba(10,11,14,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; align-items: center; gap: 12px; min-height: 56px; z-index: 100; }
.topbar-title { font-family: var(--font-display); font-weight: 700; flex: 1; }
.btn { padding: 14px; border-radius: var(--r-sm); font-weight: 600; display: flex; align-items: center; justify-content: center; width: 100%; transition: 0.15s; }
.btn-primary { background: linear-gradient(135deg, var(--indigo), var(--teal)); color: white; }
.card { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; }
.toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--bg-2); border: 1px solid var(--line-2); padding: 12px 20px; border-radius: var(--r); z-index: 9999; transition: 0.3s; }
.toast.show { bottom: 24px; }
.login { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; gap: 20px; }
</style>
</head>
<body>

<div class="app" id="app">
    <div class="login" id="loginScreen">
        <div style="font-size: 50px;">🌸</div>
        <h1 style="font-family: var(--font-display); font-size: 32px;">Maarif</h1>
        <p style="color: var(--text-2); text-align: center;">Dijital Öğretmen Asistanı</p>
        <div id="google-login-btn"></div>
    </div>

    <div id="screensContainer"></div>

    <div id="toast" class="toast"></div>
    <div id="sheet-overlay" class="sheet-overlay" onclick="Maarif.ui.closeSheet()"></div>
    <div id="sheet" class="sheet">
        <div id="sheet-header" class="topbar">
            <div id="sheet-title" class="topbar-title"></div>
            <button onclick="Maarif.ui.closeSheet()">✕</button>
        </div>
        <div id="sheet-body" style="padding: 20px;"></div>
    </div>
</div>

<script>
const Maarif = (function() {
    'use strict';

    const CONFIG = {
        VERSION: '0.8.0',
        GOOGLE_CLIENT_ID: 'YOUR_GOOGLE_CLIENT_ID', // Buraya kendi ID'nizi yapıştırın
        DRIVE_SCOPE: 'https://www.googleapis.com/auth/drive.appdata'
    };

    const MAARIF_CRITERIA = {
        cati: { label: 'Çatı Değerler', emoji: '🌳', items: ['Adalet', 'Saygı', 'Sorumluluk'] },
        entelektuel: { label: 'Entelektüel Eğilimler', emoji: '🧠', items: ['Merak', 'Yaratıcılık', 'Analitiklik'] },
        sosyal: { label: 'Sosyal Eğilimler', emoji: '🤝', items: ['Empati', 'Güven', 'Yardımlaşma'] },
        karakter: { label: 'Karakter Özellikleri', emoji: '💎', items: ['Dürüstlük', 'Vatanseverlik', 'Estetik'] }
    };

    const state = {
        user: null,
        db: { classes: [], lastSync: null },
        navStack: []
    };

    // 🧠 MODULE: PEDAGOGY (Hesaplama ve Kurallar)
    const pedagogy = {
        computeScore(events) {
            return 100 + (events || []).reduce((s, e) => s + (e.impact || 0), 0);
        },
        getStatus(score) {
            if (score >= 110) return { label: 'Yerleşmiş+', color: 'var(--emerald)' };
            if (score >= 90) return { label: 'Yerleşmiş', color: 'var(--teal)' };
            return { label: 'Desteklenmeli', color: 'var(--amber)' };
        }
    };

    // 🔵 MODULE: DATA (Veri Yönetimi)
    const data = {
        load() {
            const raw = localStorage.getItem('maarif_v8_db');
            if (raw) state.db = JSON.parse(raw);
        },
        save() {
            localStorage.setItem('maarif_v8_db', JSON.stringify(state.db));
        },
        addClass(name) {
            const cls = { id: Date.now().toString(), name, students: [] };
            state.db.classes.push(cls);
            this.save();
            return cls;
        }
    };

    // 🟢 MODULE: AUTH (Kimlik)
    const auth = {
        init() {
            const u = localStorage.getItem('maarif_user');
            if (u) {
                state.user = JSON.parse(u);
                this.onSuccess();
            }
            google.accounts.id.initialize({
                client_id: CONFIG.GOOGLE_CLIENT_ID,
                callback: (r) => this.handleSignIn(r)
            });
            google.accounts.id.renderButton(document.getElementById('google-login-btn'), { theme: 'outline', size: 'large' });
        },
        handleSignIn(resp) {
            const payload = JSON.parse(atob(resp.credential.split('.')[1]));
            state.user = { name: payload.name, email: payload.email, pic: payload.picture };
            localStorage.setItem('maarif_user', JSON.stringify(state.user));
            this.onSuccess();
        },
        onSuccess() {
            document.getElementById('loginScreen').style.display = 'none';
            data.load();
            nav.go('home');
        },
        logout() {
            localStorage.clear();
            location.reload();
        }
    };

    // ⚫ MODULE: NAV (Yönlendirme)
    const nav = {
        go(page, params = {}) {
            state.navStack.push({ page, params });
            this.render();
        },
        back() {
            if (state.navStack.length > 1) {
                state.navStack.pop();
                this.render();
            }
        },
        render() {
            const container = document.getElementById('screensContainer');
            container.innerHTML = '';
            state.navStack.forEach((s, idx) => {
                const div = document.createElement('div');
                div.className = 'screen' + (idx === state.navStack.length - 1 ? ' active' : '');
                div.innerHTML = pages[s.page](s.params);
                container.appendChild(div);
            });
        }
    };

    // 🟤 MODULE: UI (Arayüz)
    const ui = {
        toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        },
        openSheet(title, html) {
            document.getElementById('sheet-title').textContent = title;
            document.getElementById('sheet-body').innerHTML = html;
            document.getElementById('sheet').classList.add('active');
            document.getElementById('sheet-overlay').classList.add('active');
        },
        closeSheet() {
            document.getElementById('sheet').classList.remove('active');
            document.getElementById('sheet-overlay').classList.remove('active');
        }
    };

    // ⚪ MODULE: PAGES (Ekran Çizimleri)
    const pages = {
        home() {
            return `
                <div class="topbar">
                    <div class="topbar-title">Maarif Asistanı</div>
                    <button onclick="Maarif.auth.logout()">🚪</button>
                </div>
                <div style="padding: 20px;">
                    <div class="card" style="text-align: center;">
                        <h2 style="font-size: 32px;">${state.db.classes.length}</h2>
                        <p style="color: var(--text-3);">Aktif Sınıf</p>
                    </div>
                    <button class="btn btn-primary" onclick="Maarif.nav.go('classes')">Sınıflarıma Git</button>
                    <button class="btn" style="margin-top: 10px; background: var(--bg-2);" onclick="Maarif.pages.addClass()">+ Yeni Sınıf</button>
                </div>
            `;
        },
        classes() {
            let list = state.db.classes.map(c => `
                <div class="card" onclick="Maarif.ui.toast('${c.name} seçildi')">
                    <strong>${c.name}</strong>
                    <div style="font-size: 12px; color: var(--text-3);">${c.students.length} Öğrenci</div>
                </div>
            `).join('');
            return `
                <div class="topbar">
                    <button onclick="Maarif.nav.back()">←</button>
                    <div class="topbar-title">Sınıflarım</div>
                </div>
                <div style="padding: 20px;">${list || '<p>Henüz sınıf eklenmemiş.</p>'}</div>
            `;
        },
        addClass() {
            const n = prompt('Sınıf Adı:');
            if (n) {
                data.addClass(n);
                nav.render();
                ui.toast('Sınıf başarıyla eklendi');
            }
        }
    };

    return { auth, data, nav, ui, pedagogy, pages, state };
})();

// Başlatıcı
document.addEventListener('DOMContentLoaded', () => Maarif.auth.init());
</script>
</body>
</html>
