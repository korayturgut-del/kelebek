<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Maarif · Dijital Öğretmen Asistanı</title>
  <style>
    /* ═══════════════════════════════════════════════ */
    /* CSS RESET & VARIABLES                           */
    /* ═══════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    :root {
      --bg: #0f172a; --panel: #1e293b; --success: #10b981; 
      --danger: #ef4444; --warning: #f59e0b; --text: #ffffff;
      --text-muted: #94a3b8;
    }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #app { display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; }
    
    /* BOOT LOGS & FATAL ERROR */
    .log-container { background: var(--panel); padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; width: 80%; max-width: 600px; color: var(--success); overflow-y: auto; max-height: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .log-warn { color: var(--warning); }
    .log-error { color: var(--danger); }
    .fatal-error { background: #450a0a; border: 1px solid var(--danger); color: #fca5a5; padding: 20px; border-radius: 8px; max-width: 400px; text-align: center; margin: auto; position: relative; top: 30vh; font-family: monospace; }
    
    /* UI CORE - TOAST, MODAL, LOADER */
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.info { background: #3b82f6; }
    .toast.success { background: var(--success); }
    .toast.warning { background: var(--warning); color: #000; }
    .toast.error { background: var(--danger); }

    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 9998; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.2s; }
    .modal-backdrop.show { display: flex; opacity: 1; }
    .modal-content { background: var(--panel); padding: 20px; border-radius: 12px; min-width: 300px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.2s; }
    .modal-backdrop.show .modal-content { transform: scale(1); }
    .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .modal-body { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .modal-btn-primary { background: #3b82f6; color: white; }
    .modal-btn-secondary { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); }
    .input-group { margin-top: 15px; display:flex; flex-direction:column; gap:5px; }
    .input { padding:10px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:white; }

    #global-loader { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(15, 23, 42, 0.8); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    #global-loader.show { display: flex; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader-text { margin-top: 15px; font-weight: bold; color: white; }

    /* ═══════════════════════════════════════════════ */
    /* CAPTURE GUIDE (Blok 17 için)                    */
    /* ═══════════════════════════════════════════════ */
    .capture-hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.88); color: white; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 9997; display: none; gap: 8px; align-items: center; font-weight: 500; }
    .capture-hint.show { display: flex; }
    .capture-hint.warn { background: rgba(245, 158, 11, 0.95); color: #000; }
    .capture-hint.ok   { background: rgba(16, 185, 129, 0.95); }
  </style>
</head>
<body>

  <div id="app">
    <h2 id="app-title">Maarif Motoru Başlatılıyor...</h2>
    <div id="boot-logs" class="log-container"></div>
    
    <div id="exam-container" style="position:relative; margin-top:20px; display:none; max-width:90vw;">
       <img id="exam-image" style="max-width:100%; border-radius:8px; display:block;" />
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════
    // GLOBAL NAMESPACE & HEALTH REGISTRY
    // ═══════════════════════════════════════════════
    window.Modules = { registry: [], health: {} };

    // ═══════════════════════════════════════════════
    // 00. UTILS
    // ═══════════════════════════════════════════════
    Modules.utils = (() => {
      function timeout(ms) { return new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms)); }
      function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
      function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function safeClone(obj) {
        if (obj === undefined) return undefined;
        return window.structuredClone ? structuredClone(obj) : JSON.parse(JSON.stringify(obj));
      }
      function extractJSON(text) {
        try { return JSON.parse(text); } catch (err) {
          Modules.logger.warn('JSON bozuk, Boundary Extractor devrede...');
          const firstBrace = text.indexOf('{'); const lastBrace = text.lastIndexOf('}');
          const firstBracket = text.indexOf('['); const lastBracket = text.lastIndexOf(']');
          let s = -1, e = -1;
          if (firstBrace !== -1 && (firstBracket === -1 || firstBrace < firstBracket)) { s = firstBrace; e = lastBrace; } 
          else if (firstBracket !== -1) { s = firstBracket; e = lastBracket; }
          if (s === -1 || e === -1 || e <= s) throw new Error('Geçerli JSON sınırı bulunamadı.');
          return JSON.parse(text.substring(s, e + 1).replace(/,\s*([\]}])/g, '$1'));
        }
      }

      Modules.registry.push('utils'); Modules.health.utils = true;
      return Object.freeze({ timeout, sleep, escapeHTML, safeClone, extractJSON });
    })();

    // ═══════════════════════════════════════════════
    // 01-04. CORE FOUNDATION (Config, EventBus, Logger, State)
    // ═══════════════════════════════════════════════
    Modules.config = (() => {
      const CONFIG = { APP_NAME: 'Maarif Asistanı', VERSION: '1.7.2', DEBUG: true, AI_WORKER: 'https://dijital-ogretmen-api.korayturgut.workers.dev', OCR_CONFIDENCE_THRESHOLD: 0.72, OCR_FAST_MODEL: 'gemini-2.5-flash', OCR_SMART_MODEL: 'gemini-2.5-pro' };
      Object.freeze(CONFIG);
      Modules.registry.push('config'); Modules.health.config = true;
      return Object.freeze({ get: (key) => CONFIG[key], all: () => CONFIG });
    })();

    Modules.eventBus = (() => {
      const listeners = new Map();
      function on(event, callback) {
        if (!listeners.has(event)) listeners.set(event, []);
        listeners.get(event).push(callback);
        return () => off(event, callback);
      }
      function off(event, callback) {
        if (!listeners.has(event)) return;
        listeners.set(event, listeners.get(event).filter(cb => cb !== callback));
      }
      function emit(event, payload = {}) {
        if (!listeners.has(event)) return;
        [...listeners.get(event)].forEach(cb => { try { cb(payload); } catch(err) { console.error('[EventBus]', err); } });
      }
      Modules.registry.push('eventBus'); Modules.health.eventBus = true;
      return Object.freeze({ on, off, emit });
    })();

    Modules.logger = (() => {
      const debug = Modules.config.get('DEBUG');
      const history = [];
      function logToScreen(msg, className = '') {
        const div = document.getElementById('boot-logs');
        if(div) {
          const line = document.createElement('div');
          if (className) line.className = className;
          line.textContent = '> ' + msg;
          div.appendChild(line);
          div.scrollTop = div.scrollHeight; 
        }
      }
      function record(level, args) {
        const msg = args.join(' ');
        history.push({ level, message: msg, ts: Date.now() });
        if (history.length > 500) history.shift();
        return msg;
      }
      function info(...args) { const msg = record('info', args); if (debug) { console.log('%cINFO', 'color:#3b82f6', ...args); logToScreen(msg); } }
      function warn(...args) { const msg = record('warn', args); if (debug) { console.warn('%cWARN', 'color:#f59e0b', ...args); logToScreen(msg, 'log-warn'); } }
      function error(...args) { const msg = record('error', args); console.error('%cERROR', 'color:#ef4444', ...args); logToScreen(msg, 'log-error'); }
      Modules.registry.push('logger'); Modules.health.logger = true;
      return Object.freeze({ info, warn, error, getHistory: () => [...history] });
    })();

    Modules.state = (() => {
      let data = { initialized: false, bootState: { storage: false, ui: false, queue: false }, metrics: { tokens: 0 } };
      function get(key) { return Modules.utils.safeClone(data[key]); }
      function set(key, value) { data[key] = value; Modules.eventBus.emit('state:changed', { key, value: Modules.utils.safeClone(value) }); }
      function patch(key, value) { data[key] = { ...data[key], ...value }; Modules.eventBus.emit('state:changed', { key, value: Modules.utils.safeClone(data[key]) }); }
      Modules.registry.push('state'); Modules.health.state = true;
      return Object.freeze({ get, set, patch });
    })();

    // ═══════════════════════════════════════════════
    // 05-06. PERSISTENCE LAYER (Storage, Cache, Queue)
    // ═══════════════════════════════════════════════
    Modules.storage = (() => {
      let db = null;
      function ensureReady() { if (!db) throw new Error('Storage hazır değil'); }
      async function init() {
        return new Promise((resolve, reject) => {
          // CLEANUP v1.7.2: DB versiyonu ve migration delegation
          // Migration tanımları Blok 20 (migration) içinde, burada sadece çağrı yapılır.
          const targetVersion = (Modules.migration && Modules.migration.TARGET_VERSION) || 1;
          const req = indexedDB.open('MaarifDB', targetVersion);
          req.onupgradeneeded = (e) => {
            const tempDb = e.target.result;
            const oldVersion = e.oldVersion || 0;
            const newVersion = e.newVersion || targetVersion;
            // Önce default skeleton (eski davranış korunur)
            if (!tempDb.objectStoreNames.contains('examCache')) tempDb.createObjectStore('examCache', { keyPath: 'id' });
            if (!tempDb.objectStoreNames.contains('pendingQueue')) tempDb.createObjectStore('pendingQueue', { keyPath: 'id' });
            // Sonra migration runner (Blok 20)
            if (Modules.migration && typeof Modules.migration.run === 'function') {
              try { Modules.migration.run(tempDb, oldVersion, newVersion, req.transaction); }
              catch (err) { console.error('[Migration]', err); }
            }
          };
          req.onsuccess = () => { 
            db = req.result; Modules.logger.info('Storage: IndexedDB hazır (v' + db.version + ').');
            db.onclose = () => { Modules.logger.warn('IndexedDB kapandı.'); Modules.health.storage = false; };
            db.onerror = (err) => { Modules.logger.error('IndexedDB Hatası:', err); Modules.health.storage = false; };
            Modules.health.storage = true; resolve(true); 
          };
          req.onerror = () => { Modules.health.storage = false; reject(req.error); };
        });
      }
      async function put(store, item) { ensureReady(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(item); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); }
      async function getAll(store) { ensureReady(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).getAll(); req.onsuccess = () => res(req.result); req.onerror = () => rej(tx.error); }); }
      // CLEANUP v1.7.2: Yeni helper'lar (cleanup, telemetry için gerekli). Eski put/getAll aynen kalır.
      async function get(store, id) { ensureReady(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).get(id); req.onsuccess = () => res(req.result); req.onerror = () => rej(tx.error); }); }
      async function del(store, id) { ensureReady(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error); }); }
      async function count(store) { ensureReady(); return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).count(); req.onsuccess = () => res(req.result); req.onerror = () => rej(tx.error); }); }
      function getDb() { return db; } // Migration / advanced kullanım için
      Modules.registry.push('storage');
      return Object.freeze({ init, put, getAll, get, del, count, getDb });
    })();

    Modules.cache = (() => {
      async function saveExam(record) {
        record.lastAccessed = Date.now();
        // CLEANUP v1.7.2: storageRetry kullan (mobil IndexedDB lock/abort koruması)
        if (Modules.storageRetry) {
          await Modules.storageRetry.put('examCache', record);
        } else {
          await Modules.storage.put('examCache', record);
        }
      }
      Modules.registry.push('cache'); Modules.health.cache = true;
      return Object.freeze({ saveExam });
    })();

    Modules.queue = (() => {
      async function restore() {
        try { const pending = await Modules.storage.getAll('pendingQueue'); if (pending.length > 0) Modules.logger.warn(`Queue: ${pending.length} işlem kurtarıldı.`); } catch (err) { throw err; }
      }
      Modules.registry.push('queue'); Modules.health.queue = true;
      return Object.freeze({ restore });
    })();

    // ═══════════════════════════════════════════════
    // 07. UI CORE (Toast, Modal, Loader, UI Shell)
    // ═══════════════════════════════════════════════
    Modules.toast = (() => {
      let container;
      function init() {
        container = document.createElement('div'); container.id = 'toast-container'; document.body.appendChild(container);
        Modules.eventBus.on('ui:toast', (p) => show(p.msg, p.type)); Modules.health.toast = true;
      }
      function show(msg, type = 'info', duration = 3000) {
        const toast = document.createElement('div'); toast.className = `toast ${type}`; toast.textContent = msg; container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, duration);
      }
      Modules.registry.push('toast'); return Object.freeze({ init, show });
    })();

    Modules.modal = (() => {
      let backdrop;
      function init() {
        backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop'; document.body.appendChild(backdrop);
        Modules.eventBus.on('ui:modal', (p) => show(p)); Modules.health.modal = true;
      }
      // CLEANUP v1.7.1: innerHTML → dom.el (XSS güvenli)
      // PUBLIC API DEĞİŞMEDİ: show({title, content, confirmText, cancelText, onConfirm})
      // content STRING ise text node olarak güvenli render edilir (eski HTML interpolasyon BUG idi).
      // content NODE ise direkt eklenir. content { html: '...' } objesi ise (eski uyumluluk için) innerHTML olarak yazılır AMA TEHLİKELİDİR.
      function show({ title, content, confirmText = 'Tamam', cancelText = 'İptal', onConfirm }) {
        const dom = Modules.dom; const utils = Modules.utils;
        Modules.dom.clear(backdrop);

        // Body content render: 3 mod (Node, string-safe, {html}-legacy)
        const bodyNode = dom.el('div', { class: 'modal-body' });
        if (content instanceof Node) {
          bodyNode.appendChild(content);
        } else if (content && typeof content === 'object' && typeof content.html === 'string') {
          // LEGACY UYUMLULUK: eski çağrılar {html: '<input>'} verebiliyordu
          Modules.logger.warn('modal.show: content.html kullanımı DEPRECATED. dom.el ile Node geçirin.');
          bodyNode.innerHTML = content.html;
        } else {
          // STRING → text node (XSS güvenli)
          bodyNode.appendChild(document.createTextNode(String(content == null ? '' : content)));
        }

        const actionsChildren = [];
        if (onConfirm) {
          actionsChildren.push(dom.el('button', {
            class: 'modal-btn modal-btn-secondary',
            id: 'modal-cancel',
            onClick: () => hide()
          }, [String(cancelText)]));
        }
        actionsChildren.push(dom.el('button', {
          class: 'modal-btn modal-btn-primary',
          id: 'modal-confirm',
          onClick: () => { if (onConfirm) onConfirm(); hide(); }
        }, [String(confirmText)]));

        const modal = dom.el('div', { class: 'modal-content' }, [
          dom.el('div', { class: 'modal-header' }, [String(title || '')]),
          bodyNode,
          dom.el('div', { class: 'modal-actions' }, actionsChildren)
        ]);

        backdrop.appendChild(modal);
        backdrop.classList.add('show');
      }
      function hide() { backdrop.classList.remove('show'); setTimeout(() => { Modules.dom.clear(backdrop); }, 200); }
      Modules.registry.push('modal'); return Object.freeze({ init, show, hide });
    })();

    Modules.loader = (() => {
      let loaderEl, textEl;
      function init() {
        loaderEl = document.createElement('div'); loaderEl.id = 'global-loader'; loaderEl.innerHTML = `<div class="spinner"></div><div class="loader-text" id="loader-msg">Lütfen Bekleyin...</div>`;
        document.body.appendChild(loaderEl); textEl = document.getElementById('loader-msg');
        Modules.eventBus.on('ui:loader:show', (p) => show(p.msg)); Modules.eventBus.on('ui:loader:hide', () => hide()); Modules.health.loader = true;
      }
      function show(msg = 'Yükleniyor...') { textEl.textContent = msg; loaderEl.classList.add('show'); }
      function hide() { loaderEl.classList.remove('show'); }
      Modules.registry.push('loader'); return Object.freeze({ init, show, hide });
    })();

    Modules.ui = (() => {
      let initialized = false; const els = {}; 
      async function init() {
        if (initialized) return;
        els.app = document.getElementById('app'); els.title = document.getElementById('app-title');
        Modules.toast.init(); Modules.modal.init(); Modules.loader.init();
        initialized = true; Modules.health.ui = true; Modules.logger.info('UI Core yüklendi.');
      }
      Modules.registry.push('ui'); return Object.freeze({ init, els });
    })();

    // ═══════════════════════════════════════════════
    // 08. IMAGE UTILS
    // ═══════════════════════════════════════════════
    Modules.imageUtils = (() => {
      async function compress(dataUrl, maxSize = 1400, quality = 0.72) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; } else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', quality);
            canvas.width = 0; canvas.height = 0; img.onload = null; img.onerror = null; img.src = '';
            resolve(compressed);
          };
          img.onerror = () => { img.onerror = null; img.src = ''; reject(new Error('Görsel okunamadı.')); }; img.src = dataUrl;
        });
      }
      Modules.registry.push('imageUtils'); Modules.health.imageUtils = true;
      return Object.freeze({ compress });
    })();

    // ═══════════════════════════════════════════════
    // 09. AI ENGINE (API İletişimi & Cost Limit)
    // ═══════════════════════════════════════════════
    Modules.ai = (() => {
      const MAX_RETRY = 2; const DAILY_TOKEN_LIMIT = 500000; const activeControllers = new Set(); 

      async function request(payload, retryCount = 0, externalSignal = null) {
        const currentTokens = Modules.state.get('metrics')?.tokens || 0;
        if (currentTokens > DAILY_TOKEN_LIMIT) throw new Error('Günlük AI Token limiti aşıldı.');

        const workerUrl = Modules.config.get('AI_WORKER');
        const controller = new AbortController(); activeControllers.add(controller);

        const abortHandler = () => controller.abort();
        if (externalSignal) externalSignal.addEventListener('abort', abortHandler);
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        try {
          Modules.logger.info(`AI İstek [${payload.model}] (Deneme: ${retryCount + 1})`);
          const r = await fetch(workerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal });

          if (!r.ok) { if (r.status >= 400 && r.status < 500 && r.status !== 429) throw new Error(`Kritik Hata (HTTP ${r.status}) - Tekrar denenmeyecek.`); throw new Error(`HTTP ${r.status}`); }
          
          const json = await r.json();
          if (!json.text) throw new Error('AI boş yanıt döndürdü');
          if (json.usage) Modules.state.patch('metrics', { tokens: currentTokens + (json.usage.totalTokenCount || 0) });

          return Modules.utils.extractJSON(json.text);
        } catch (err) {
          if (err.name === 'AbortError') { Modules.logger.warn('AI İsteği İptal Edildi.'); throw err; }
          if (err.message.includes('Tekrar denenmeyecek') || err.message.includes('limiti aşıldı')) throw err;
          if (retryCount < MAX_RETRY) {
            const backoffMs = 1000 * (retryCount + 1); Modules.logger.warn(`AI Hatası. ${backoffMs}ms bekleniyor...`);
            await Modules.utils.sleep(backoffMs); return request(payload, retryCount + 1, externalSignal);
          }
          Modules.logger.error('AI Başarısız:', err.message); throw err;
        } finally {
          clearTimeout(timeoutId); activeControllers.delete(controller);
          if (externalSignal) externalSignal.removeEventListener('abort', abortHandler);
        }
      }
      function cancelAll() { activeControllers.forEach(c => c.abort()); activeControllers.clear(); }
      Modules.registry.push('ai'); Modules.health.ai = true;
      return Object.freeze({ request, cancelAll });
    })();

    // ═══════════════════════════════════════════════
    // 10. OCR MOTORU (SHA-256 Hash & Heuristics)
    // ═══════════════════════════════════════════════
    Modules.ocr = (() => {
      // 1. SHA-256 HASH (Çakışma Koruması)
      async function hashImage(dataUrl) {
        const msgBuffer = new TextEncoder().encode(dataUrl);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        return 'img_' + Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }

      function normalizeBBox(bbox) {
        if (!Array.isArray(bbox) || bbox.length !== 4) return [0,0,0,0];
        return bbox.map(v => Math.max(0, Math.min(1000, Number(v) || 0)));
      }

      function getOverlapArea(b1, b2) {
        const xOverlap = Math.max(0, Math.min(b1[3], b2[3]) - Math.max(b1[1], b2[1]));
        const yOverlap = Math.max(0, Math.min(b1[2], b2[2]) - Math.max(b1[0], b2[0]));
        return xOverlap * yOverlap;
      }

      function validateAndEnhance(result) {
        if (!Array.isArray(result.questions)) throw new Error('Geçersiz OCR şeması.');

        // CLEANUP v1.7.1: questionNo sanitize + duplicate kaldırma → ocrValidator.sanitize'a delege
        // Burada SADECE bbox/answer kalite penalty hesabı kalır.
        const sanitized = Modules.ocrValidator.sanitize(result);
        let penalty = 0;
        sanitized.questions.forEach((q, index) => {
          q.bbox = normalizeBBox(q.bbox);
          q.answer = String(q.answer || '').trim();
          if (q.answer.length < 2) penalty += 0.05;
          if (q.bbox[2] - q.bbox[0] < 10) penalty += 0.05;
          for (let i = 0; i < index; i++) {
            if (getOverlapArea(q.bbox, sanitized.questions[i].bbox) > 5000) penalty += 0.1;
          }
        });
        return {
          questions: sanitized.questions,
          // sanitize zaten reject-rate cezası uyguladı; üstüne kalite penalty ekle
          confidence: Math.max(0, (Number(sanitized.confidence) || 0.8) - penalty)
        };
      }

      async function perform(imageData, model, signal) {
        const schema = { type: 'OBJECT', properties: { confidence: { type: 'NUMBER' }, questions: { type: 'ARRAY', items: { type: 'OBJECT', properties: { questionNo: { type: 'INTEGER' }, answer: { type: 'STRING' }, bbox: { type: 'ARRAY', items: { type: 'INTEGER' } } }, required: ['questionNo', 'answer', 'bbox'] } } }, required: ['questions', 'confidence'] };
        const result = await Modules.ai.request({ model: model || Modules.config.get('OCR_FAST_MODEL'), jsonMode: true, responseSchema: schema, temperature: 0.1, systemPrompt: 'Sen OCR motorusun. Kağıttaki cevapları, numaraları ve koordinatları ([ymin, xmin, ymax, xmax] 0-1000 arası) bul.', userPrompt: 'Yazılıyı OCR yap.', images: [imageData] }, 0, signal);
        return validateAndEnhance(result);
      }
      Modules.registry.push('ocr'); Modules.health.ocr = true;
      return Object.freeze({ perform, hashImage });
    })();

    // ═══════════════════════════════════════════════
    // 11. DEĞERLENDİRME MOTORU (NFKC Normalization)
    // ═══════════════════════════════════════════════
    Modules.grading = (() => {
      // 3. NFKC GÜVENLİ NORMALİZASYON (Boşluk, noktalama ve unicode temizliği)
      const normalizeTxt = (txt) => String(txt).normalize('NFKC').toLowerCase().replace(/[\s\W_]+/g, '');

      function deterministicCheck(ocrQuestions, answerKey) {
        const results = []; const remainingForAI = [];
        ocrQuestions.forEach(q => {
          const key = answerKey.find(k => k.questionNo === q.questionNo);
          if (!key) return;
          if (key.exactMatch) {
            const studentAns = normalizeTxt(q.answer); const correctAns = normalizeTxt(key.answer);
            if (studentAns === correctAns) results.push({ questionNo: q.questionNo, score: key.maxScore, maxScore: key.maxScore, status: 'correct', isDeterministic: true });
            else results.push({ questionNo: q.questionNo, score: 0, maxScore: key.maxScore, status: 'wrong', isDeterministic: true });
          } else remainingForAI.push(q);
        });
        return { deterministicResults: results, remainingForAI };
      }

      async function evaluate(ocrData, answerKey, signal) {
        const { deterministicResults, remainingForAI } = deterministicCheck(ocrData.questions, answerKey);
        let aiEvaluations = [];
        if (remainingForAI.length > 0) {
          const schema = { type: 'OBJECT', properties: { evaluations: { type: 'ARRAY', items: { type: 'OBJECT', properties: { questionNo: { type: 'INTEGER' }, score: { type: 'INTEGER' }, maxScore: { type: 'INTEGER' }, status: { type: 'STRING' } }, required: ['questionNo', 'score', 'maxScore', 'status'] } } }, required: ['evaluations'] };
          const result = await Modules.ai.request({ model: Modules.config.get('OCR_FAST_MODEL'), jsonMode: true, responseSchema: schema, temperature: 0.2, systemPrompt: 'Sen öğretmensin. Kısmi puan ver.', userPrompt: `Cevaplar: ${JSON.stringify(remainingForAI)}\nAnahtar: ${JSON.stringify(answerKey)}` }, 0, signal);
          aiEvaluations = result.evaluations;
        }

        let combinedEvaluations = [...deterministicResults, ...aiEvaluations];
        let safeTotal = 0;
        combinedEvaluations = combinedEvaluations.map(ev => {
          const max = Number(ev.maxScore) || 10; ev.score = Math.max(0, Math.min(Number(ev.score) || 0, max)); safeTotal += ev.score;
          const originalQ = ocrData.questions.find(x => x.questionNo === ev.questionNo);
          return { ...ev, bbox: originalQ ? originalQ.bbox : [0,0,0,0] };
        });
        return { totalScore: safeTotal, evaluations: combinedEvaluations };
      }
      Modules.registry.push('grading'); Modules.health.grading = true;
      return Object.freeze({ evaluate });
    })();

    // ═══════════════════════════════════════════════
    // 12. OVERLAY (Modal UI & Bbox Çizimi)
    // ═══════════════════════════════════════════════
    Modules.overlay = (() => {
      let activeState = null; let resizeTimer; let resizeId = 0;

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer); const currentId = ++resizeId;
        resizeTimer = setTimeout(() => { if (activeState && currentId === resizeId && document.body.contains(document.getElementById(activeState.containerId))) render(activeState.containerId, activeState.evaluation, activeState.imgElement); }, 150);
      });

      function clear() {
        resizeId++; if (activeState && activeState.containerId) { const container = document.getElementById(activeState.containerId); if (container) container.querySelectorAll('.ai-overlay').forEach(el => el.remove()); }
        activeState = null;
      }

      // CLEANUP v1.7.1:
      //  - Position: rect.width fallback yerine overlayFix.bboxToPixels (naturalWidth + object-fit doğru)
      //  - Modal: HTML string yerine DOM Node geçir (XSS güvenli)
      // PUBLIC API DEĞİŞMEDİ: render(containerId, evaluationResult, imgElement)
      function render(containerId, evaluationResult, imgElement) {
        const container = document.getElementById(containerId); if (!container || !imgElement) return;
        container.querySelectorAll('.ai-overlay').forEach(el => el.remove());
        activeState = { containerId, evaluation: evaluationResult, imgElement };
        const fragment = document.createDocumentFragment();
        const dom = Modules.dom;

        evaluationResult.evaluations.forEach(ev => {
          const [ymin, xmin, ymax, xmax] = ev.bbox; if (ymin === 0 && xmax === 0) return;

          // CLEANUP B: overlayFix kullan (naturalWidth ratio + object-fit offset)
          const pos = Modules.overlayFix.bboxToPixels(ev.bbox, imgElement);
          if (!pos.valid) return;

          const bg = ev.status === 'correct' ? 'var(--success)' : (ev.status === 'partial' ? 'var(--warning)' : 'var(--danger)');
          const div = document.createElement('div');
          div.className = 'ai-overlay';
          div.style.cssText = `position:absolute; left:${pos.left}px; top:${pos.top}px; z-index:20; padding:4px 8px; border-radius:8px; color:#fff; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.3); background:${bg};`;
          div.textContent = `${ev.score}/${ev.maxScore}`;

          div.onclick = (e) => {
            e.stopPropagation();
            // CLEANUP A+B: Modal'a HTML string DEĞİL, DOM Node geçir
            const input = dom.el('input', {
              type: 'number', id: 'modal-score-input', class: 'input',
              value: String(ev.score), min: '0', max: String(ev.maxScore),
              style: { fontSize: '20px', fontWeight: 'bold', textAlign: 'center' }
            });
            const body = dom.el('div', { class: 'input-group' }, [
              dom.el('label', { class: 'input-label' }, [`Yeni Puan (Maks: ${ev.maxScore})`]),
              input
            ]);
            Modules.eventBus.emit('ui:modal', {
              title: `Soru ${ev.questionNo} Puanı`,
              content: body, // ← Node, string değil
              confirmText: 'Kaydet', cancelText: 'İptal',
              onConfirm: () => {
                // input modal'a eklendi, hâlâ erişilebilir
                const num = Math.max(0, Math.min(Number(input.value) || 0, ev.maxScore));
                ev.originalScore = ev.score; ev.score = num; ev.teacherCorrected = true;
                div.textContent = `${num}/${ev.maxScore}`;
                div.style.background = '#3b82f6';
                Modules.eventBus.emit('ui:toast', { msg: 'Puan güncellendi.', type: 'success' });
              }
            });
          };
          fragment.appendChild(div);
        });
        container.appendChild(fragment);
      }
      Modules.registry.push('overlay'); Modules.health.overlay = true;
      return Object.freeze({ render, clear });
    })();

    // ═══════════════════════════════════════════════
    // 13. EXAM ENGINE (Ana Orkestratör & LRU Cache Limit)
    // ═══════════════════════════════════════════════
    Modules.examEngine = (() => {
      let currentAbortController = null;
      const sessionOcrCache = new Map(); 

      function cancel() {
        if (currentAbortController) {
          currentAbortController.abort(); currentAbortController = null;
          Modules.ai.cancelAll(); Modules.overlay.clear(); 
          Modules.eventBus.emit('ui:loader:hide'); Modules.eventBus.emit('ui:toast', { msg: 'Sınav okuma iptal edildi.', type: 'warning' });
        }
      }

      async function processPaper(imageDataUrl, answerKey, uiContainerId, uiImageElementId, opts = {}) {
        cancel(); Modules.overlay.clear(); 
        currentAbortController = new AbortController(); const signal = currentAbortController.signal;
        const t0 = performance.now();
        
        Modules.eventBus.emit('ui:loader:show', { msg: 'Kağıt Hazırlanıyor...' });

        try {
          // CLEANUP v1.7.2: opsiyonel image preprocessing (autoContrast → daha iyi OCR)
          let compressed = await Modules.imageUtils.compress(imageDataUrl);
          if (Modules.imagePrep && opts.preprocess !== false) {
            try { compressed = await Modules.imagePrep.enhance(compressed, { autoContrast: true }); }
            catch (err) { Modules.logger.warn('Preprocess fail (devam ediliyor):', err.message); }
          }
          if (signal.aborted) throw new Error('AbortError');
          
          const imgHash = await Modules.ocr.hashImage(compressed); // SHA-256 Async

          // CLEANUP v1.7.2: Replay guard — aynı kağıt 2. kez yüklenirse uyar
          if (Modules.replayGuard) {
            const dup = await Modules.replayGuard.check(imgHash);
            if (dup && opts.allowReplay !== true) {
              Modules.eventBus.emit('ui:toast', { msg: 'Bu kağıt daha önce işlenmiş.', type: 'warning' });
              if (Modules.telemetry) Modules.telemetry.track('exam.replay_blocked', { hash: imgHash.slice(0,16) });
              // Yine de devam etmek isterse opts.allowReplay=true
              return null;
            }
          }

          let ocr;
          if (sessionOcrCache.has(imgHash)) {
            Modules.logger.info('OCR Cache Hit: API atlandı.');
            ocr = sessionOcrCache.get(imgHash);
            if (Modules.telemetry) Modules.telemetry.track('ocr.cache_hit', {});
          } else {
            Modules.eventBus.emit('ui:loader:show', { msg: 'Yapay Zeka Okuyor...' });
            // CLEANUP v1.7.2: OCR çağrısı telemetry ile sarıldı
            const ocrCall = async () => {
              let r = await Modules.ocr.perform(compressed, Modules.config.get('OCR_FAST_MODEL'), signal);
              if (r.confidence < Modules.config.get('OCR_CONFIDENCE_THRESHOLD')) {
                Modules.eventBus.emit('ui:toast', { msg: `Zorlu yazı, güçlü model devrede.`, type: 'warning' });
                if (Modules.telemetry) Modules.telemetry.track('ocr.escalated', { confidence: r.confidence });
                r = await Modules.ocr.perform(compressed, Modules.config.get('OCR_SMART_MODEL'), signal);
              }
              return r;
            };
            ocr = Modules.telemetry ? await Modules.telemetry.timing('ocr.run', ocrCall) : await ocrCall();
            
            // 2. LRU CACHE LİMİTİ (50 kaydı aşarsa en eskiyi sil)
            if (sessionOcrCache.size >= 50) sessionOcrCache.delete(sessionOcrCache.keys().next().value);
            sessionOcrCache.set(imgHash, ocr); 
          }

          Modules.eventBus.emit('ui:loader:show', { msg: 'Puanlama Yapılıyor...' });
          const gradingCall = () => Modules.grading.evaluate(ocr, answerKey, signal);
          const evaluation = Modules.telemetry ? await Modules.telemetry.timing('grading.run', gradingCall) : await gradingCall();

          const imgEl = document.getElementById(uiImageElementId);
          Modules.overlay.render(uiContainerId, evaluation, imgEl);

          // CLEANUP v1.7.2: Versioned record. Aynı kağıt revize edilirse history korunur.
          let record;
          if (Modules.examVersion) {
            const baseId = opts.baseId || Modules.examVersion.newId();
            const revision = await Modules.examVersion.nextRevision(baseId);
            record = Modules.examVersion.wrap({
              preview: compressed, ocr, evaluation,
              imgHash, timestamp: new Date().toISOString()
            }, baseId, revision);
          } else {
            record = { id: 'exam_' + Date.now(), preview: compressed, ocr, evaluation, timestamp: new Date().toISOString() };
          }
          Modules.cache.saveExam(record).catch(err => Modules.logger.warn('Cache kayıt hatası:', err));

          // Replay guard'a kaydet (next time block edilsin)
          if (Modules.replayGuard) Modules.replayGuard.mark(imgHash, { examId: record.id, ts: Date.now() }).catch(() => {});

          if (Modules.telemetry) Modules.telemetry.track('exam.processed', { ms: Math.round(performance.now() - t0), confidence: ocr.confidence, questions: (ocr.questions || []).length });
          Modules.eventBus.emit('ui:toast', { msg: `✓ İşlem Başarılı (${Math.round(performance.now() - t0)}ms)`, type: 'success' });
          return record;

        } catch (err) {
          if (err.name !== 'AbortError' && err.message !== 'AbortError') {
            Modules.logger.error('Motor Hatası:', err); Modules.eventBus.emit('ui:toast', { msg: `Başarısız: ${err.message}`, type: 'error' });
            if (Modules.telemetry) Modules.telemetry.track('exam.failed', { err: err.message, ms: Math.round(performance.now() - t0) });
          }
          return null;
        } finally {
          currentAbortController = null; Modules.eventBus.emit('ui:loader:hide');
        }
      }

      Modules.registry.push('examEngine'); Modules.health.examEngine = true;
      return Object.freeze({ processPaper, cancel });
    })();

    // ═══════════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════════
    // ★★★ YENİ EKLENEN BAĞIMSIZ BLOKLAR (v1.7.0) ★★★
    // Aşağıdaki bloklar yukarıdaki sistemi DEĞİŞTİRMEZ.
    // Her biri TAM BAĞIMSIZ, kendi başına çalışır, opsiyoneldir.
    // Üst sistem bunlardan haberi olmasa bile çalışır.
    // ═══════════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════════════════════════


    // ═══════════════════════════════════════════════
    // 14. DOM BUILDER (XSS Koruması - Güvenli HTML)
    // ───────────────────────────────────────────────
    // AMAÇ: Modal/Overlay içine güvensiz string sokmak yerine
    //       DOM elemanı inşa et. innerHTML yerine kullanılacak.
    // BAĞIMSIZLIK: Hiçbir modüle bağlı değil. Tek başına çalışır.
    // KULLANIM: const el = Modules.dom.el('div', {class:'x'}, ['merhaba']);
    // ═══════════════════════════════════════════════
    Modules.dom = (() => {
      // Güvenli element oluşturucu - innerHTML KULLANMAZ
      function el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [key, val] of Object.entries(attrs || {})) {
          if (val == null || val === false) continue;
          if (key === 'class' || key === 'className') node.className = String(val);
          else if (key === 'style' && typeof val === 'object') {
            for (const [sk, sv] of Object.entries(val)) node.style[sk] = sv;
          }
          else if (key === 'dataset' && typeof val === 'object') {
            for (const [dk, dv] of Object.entries(val)) node.dataset[dk] = dv;
          }
          else if (key.startsWith('on') && typeof val === 'function') {
            node.addEventListener(key.slice(2).toLowerCase(), val);
          }
          else node.setAttribute(key, String(val));
        }
        const list = Array.isArray(children) ? children : [children];
        for (const child of list) {
          if (child == null || child === false) continue;
          if (typeof child === 'string' || typeof child === 'number') {
            node.appendChild(document.createTextNode(String(child)));
          } else if (child instanceof Node) {
            node.appendChild(child);
          }
        }
        return node;
      }
      // Bir kapsayıcının tüm çocuklarını sil (innerHTML='' yerine güvenli)
      function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }
      // Sadece metin ata (innerText yerine ama güvenli)
      function setText(node, text) { if (!node) return; clear(node); node.appendChild(document.createTextNode(String(text ?? ''))); }

      Modules.registry.push('dom'); Modules.health.dom = true;
      return Object.freeze({ el, clear, setText });
    })();


    // ═══════════════════════════════════════════════
    // 15. STATE TRANSACTION (Token Race Condition Koruması)
    // ───────────────────────────────────────────────
    // AMAÇ: 2 paralel AI isteği aynı anda token yazınca
    //       overwrite olmasını engelle. Atomic update.
    // BAĞIMSIZLIK: state varsa onu kullanır, yoksa kendi başına çalışır.
    // KULLANIM: Modules.tx.addTokens(1234);
    //          Modules.tx.run('metrics', m => ({...m, tokens: m.tokens+1234}));
    // ═══════════════════════════════════════════════
    Modules.tx = (() => {
      const locks = new Map(); // key -> Promise zinciri

      // Atomic update: aynı key üzerinde paralel update'ler sıraya girer
      async function run(key, updaterFn) {
        const prev = locks.get(key) || Promise.resolve();
        const next = prev.then(async () => {
          try {
            const current = (Modules.state && typeof Modules.state.get === 'function') ? Modules.state.get(key) : {};
            const updated = await updaterFn(current || {});
            if (Modules.state && typeof Modules.state.set === 'function') Modules.state.set(key, updated);
            return updated;
          } catch (err) {
            if (Modules.logger) Modules.logger.error('TX hatası:', err.message);
            throw err;
          }
        }).catch(err => { /* zincir kırılmasın */ if (Modules.logger) Modules.logger.warn('TX zincir hatası yutuldu:', err.message); });
        locks.set(key, next);
        // Cleanup: işi bitince map'i şişirme
        next.finally(() => { if (locks.get(key) === next) locks.delete(key); });
        return next;
      }

      // Token sayacı için pratik kısayol
      async function addTokens(n) {
        const add = Number(n) || 0;
        return run('metrics', (m) => {
          const cur = (m && typeof m === 'object') ? m : {};
          return { ...cur, tokens: (Number(cur.tokens) || 0) + add };
        });
      }

      Modules.registry.push('tx'); Modules.health.tx = true;
      return Object.freeze({ run, addTokens });
    })();


    // ═══════════════════════════════════════════════
    // 16. STORAGE RETRY (IndexedDB Lock/Quota Koruması)
    // ───────────────────────────────────────────────
    // AMAÇ: Mobil IndexedDB bazen lock/abort/quota verir.
    //       Tek hatada fail etme - 3 kez dene, exponential backoff.
    // BAĞIMSIZLIK: storage varsa onu kullanır. Yoksa hata fırlatır.
    // KULLANIM: await Modules.storageRetry.put('examCache', {id:1});
    //          await Modules.storageRetry.getAll('examCache');
    // ═══════════════════════════════════════════════
    Modules.storageRetry = (() => {
      const MAX_TRIES = 3;
      const BASE_DELAY = 200; // ms

      function isRetryable(err) {
        if (!err) return false;
        const name = String(err.name || '');
        const msg  = String(err.message || '').toLowerCase();
        // Geçici hatalar: lock, abort, transient, transaction
        if (name === 'TransactionInactiveError') return true;
        if (name === 'InvalidStateError') return true;
        if (name === 'AbortError') return true;
        if (msg.includes('lock')) return true;
        if (msg.includes('transient')) return true;
        // Quota tarzı kalıcı hatalar retry edilmez
        if (name === 'QuotaExceededError') return false;
        if (msg.includes('quota')) return false;
        return true; // bilinmeyen → dene
      }

      async function withRetry(fn, opName = 'storage') {
        let lastErr;
        for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
          try { return await fn(); }
          catch (err) {
            lastErr = err;
            if (!isRetryable(err) || attempt === MAX_TRIES) {
              if (Modules.logger) Modules.logger.error(`${opName} kalıcı hata:`, err.message);
              throw err;
            }
            const wait = BASE_DELAY * Math.pow(2, attempt - 1); // 200, 400, 800
            if (Modules.logger) Modules.logger.warn(`${opName} retry ${attempt}/${MAX_TRIES} (${wait}ms): ${err.message}`);
            await new Promise(r => setTimeout(r, wait));
          }
        }
        throw lastErr;
      }

      async function put(store, item)   { return withRetry(() => Modules.storage.put(store, item),   `storage.put(${store})`); }
      async function getAll(store)      { return withRetry(() => Modules.storage.getAll(store),      `storage.getAll(${store})`); }

      Modules.registry.push('storageRetry'); Modules.health.storageRetry = true;
      return Object.freeze({ put, getAll, withRetry });
    })();


    // ═══════════════════════════════════════════════
    // 17. CAPTURE GUIDE (Kamera Çekim Kalite Rehberi)
    // ───────────────────────────────────────────────
    // AMAÇ: Kullanıcı çekmeden ÖNCE uyar.
    //       Blur (bulanık), karanlık, çok parlak → uyarı göster.
    //       Blur = Laplacian variance. Parlaklık = avg luminance.
    // BAĞIMSIZLIK: DOM ve tek bir <video>/<img> alır. Başka modüle bağlı değil.
    // KULLANIM: const stop = Modules.captureGuide.start(videoEl);
    //          ...sonra: stop();
    //          Tek kare için: const res = await Modules.captureGuide.checkImage(dataUrl);
    // ═══════════════════════════════════════════════
    Modules.captureGuide = (() => {
      // ── Eşikler (gerçek telefon testinde ayarlanır) ──
      const BLUR_MIN = 80;     // Laplacian variance < BLUR_MIN → bulanık
      const DARK_MAX = 60;     // ortalama parlaklık (0-255) < DARK_MAX → karanlık
      const BRIGHT_MAX = 220;  // > BRIGHT_MAX → aşırı parlak
      const SAMPLE_SIZE = 160; // analiz için küçültme boyutu (perf)
      const TICK_MS = 500;     // canlı analiz aralığı

      // ── Tek kareden metrikler çıkar ──
      function analyzeImageData(imgData) {
        const { data, width, height } = imgData;
        // Grayscale + parlaklık ortalaması
        const gray = new Float32Array(width * height);
        let sum = 0;
        for (let i = 0, p = 0; i < data.length; i += 4, p++) {
          const g = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
          gray[p] = g; sum += g;
        }
        const avg = sum / (width * height);

        // Laplacian variance (basit 3x3 kernel: -1 -1 -1 / -1 8 -1 / -1 -1 -1)
        let lSum = 0, lSumSq = 0, lN = 0;
        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            const i = y * width + x;
            const v = 8 * gray[i]
              - gray[i - 1] - gray[i + 1]
              - gray[i - width] - gray[i + width]
              - gray[i - width - 1] - gray[i - width + 1]
              - gray[i + width - 1] - gray[i + width + 1];
            lSum += v; lSumSq += v * v; lN++;
          }
        }
        const mean = lSum / lN;
        const variance = (lSumSq / lN) - (mean * mean);
        return { brightness: avg, blurScore: variance };
      }

      // ── Frame'i SAMPLE_SIZE'a indirip ImageData al ──
      function sampleFrame(source, w, h) {
        const ratio = Math.min(SAMPLE_SIZE / w, SAMPLE_SIZE / h, 1);
        const cw = Math.max(8, Math.round(w * ratio));
        const ch = Math.max(8, Math.round(h * ratio));
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(source, 0, 0, cw, ch);
        return ctx.getImageData(0, 0, cw, ch);
      }

      // ── Verdiği metriklere göre durum ──
      function judge(metrics) {
        if (metrics.brightness < DARK_MAX)   return { status: 'warn', code: 'dark',   msg: 'Daha fazla ışık alın' };
        if (metrics.brightness > BRIGHT_MAX) return { status: 'warn', code: 'bright', msg: 'Parlamayı azaltın' };
        if (metrics.blurScore < BLUR_MIN)    return { status: 'warn', code: 'blur',   msg: 'Sabit tutun, bulanık' };
        return { status: 'ok', code: 'ok', msg: 'Çekmeye hazır' };
      }

      // ── Ekrana üst bant uyarı yerleştir ──
      function ensureHintEl() {
        let el = document.getElementById('capture-hint');
        if (!el) {
          el = document.createElement('div');
          el.id = 'capture-hint'; el.className = 'capture-hint';
          document.body.appendChild(el);
        }
        return el;
      }
      function showHint(judgement) {
        const el = ensureHintEl();
        el.className = 'capture-hint show ' + (judgement.status === 'ok' ? 'ok' : 'warn');
        el.textContent = judgement.msg;
      }
      function hideHint() { const el = document.getElementById('capture-hint'); if (el) el.classList.remove('show'); }

      // ── Canlı video akışı için periyodik analiz ──
      function start(videoEl) {
        if (!videoEl) return () => {};
        let stopped = false;
        const tick = () => {
          if (stopped) return;
          try {
            const w = videoEl.videoWidth || 0, h = videoEl.videoHeight || 0;
            if (w > 0 && h > 0) {
              const data = sampleFrame(videoEl, w, h);
              const metrics = analyzeImageData(data);
              showHint(judge(metrics));
            }
          } catch (err) { if (Modules.logger) Modules.logger.warn('CaptureGuide tick:', err.message); }
          setTimeout(tick, TICK_MS);
        };
        tick();
        return () => { stopped = true; hideHint(); };
      }

      // ── Tek görüntü için kontrol (çekildikten sonra) ──
      async function checkImage(dataUrl) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            try {
              const data = sampleFrame(img, img.naturalWidth, img.naturalHeight);
              const metrics = analyzeImageData(data);
              const j = judge(metrics);
              resolve({ ...metrics, judgement: j, ok: j.status === 'ok' });
            } catch (err) { reject(err); }
            finally { img.onload = null; img.onerror = null; img.src = ''; }
          };
          img.onerror = () => { img.onload = null; img.onerror = null; img.src = ''; reject(new Error('Görsel okunamadı')); };
          img.src = dataUrl;
        });
      }

      Modules.registry.push('captureGuide'); Modules.health.captureGuide = true;
      return Object.freeze({ start, checkImage, hideHint, analyzeImageData });
    })();


    // ═══════════════════════════════════════════════
    // 18. OCR VALIDATOR (Soru No Sanitizasyonu)
    // ───────────────────────────────────────────────
    // AMAÇ: AI bazen questionNo = -1, 0, NaN, "1a", duplicate döner.
    //       Bunları temizle, "fantom soru" oluşumunu engelle.
    // BAĞIMSIZLIK: Saf fonksiyon. Hiçbir modüle bağlı değil.
    // KULLANIM: const safe = Modules.ocrValidator.sanitize(ocrResult);
    // ═══════════════════════════════════════════════
    Modules.ocrValidator = (() => {
      const MAX_QUESTION_NO = 200; // makul üst sınır (200 sorudan fazla yazılı pek olmaz)

      function toIntStrict(v) {
        if (v === null || v === undefined) return null;
        if (typeof v === 'number') return Number.isFinite(v) ? Math.trunc(v) : null;
        // "1", "1.", "1)", " 1 " gibi durumları tolere et ama "1a" reddet
        const s = String(v).trim();
        const m = s.match(/^(-?\d+)[\.\)\:\-]?$/);
        if (!m) return null;
        const n = parseInt(m[1], 10);
        return Number.isFinite(n) ? n : null;
      }

      function sanitize(ocrResult) {
        if (!ocrResult || !Array.isArray(ocrResult.questions)) {
          return { questions: [], confidence: 0, rejected: [], reason: 'invalid_schema' };
        }
        const seen = new Map();   // questionNo -> en iyi aday
        const rejected = [];

        for (const q of ocrResult.questions) {
          const qn = toIntStrict(q && q.questionNo);
          // Reddet: parse edilemez, <=0, çok büyük
          if (qn === null) { rejected.push({ reason: 'unparseable', raw: q && q.questionNo }); continue; }
          if (qn <= 0)     { rejected.push({ reason: 'non_positive', raw: q.questionNo }); continue; }
          if (qn > MAX_QUESTION_NO) { rejected.push({ reason: 'too_large', raw: q.questionNo }); continue; }

          // Cevap sanitize
          const ans = String((q && q.answer) || '').trim();
          // Çok kısa cevap (1 karakter) düşük kalite işareti ama atılmaz, sadece flag
          const candidate = { ...q, questionNo: qn, answer: ans };

          // Duplicate: daha uzun cevap olanı tut
          if (!seen.has(qn) || (ans.length > (seen.get(qn).answer || '').length)) {
            seen.set(qn, candidate);
          } else {
            rejected.push({ reason: 'duplicate_shorter', raw: q.questionNo });
          }
        }

        // Sıralı dön
        const clean = Array.from(seen.values()).sort((a, b) => a.questionNo - b.questionNo);
        // Confidence: çok reddedilen varsa cezalandır
        const total = clean.length + rejected.length;
        const rejectRate = total > 0 ? rejected.length / total : 0;
        const confidence = Math.max(0, (Number(ocrResult.confidence) || 0.8) - rejectRate * 0.3);

        return { questions: clean, confidence, rejected, reason: rejected.length ? 'sanitized' : 'ok' };
      }

      Modules.registry.push('ocrValidator'); Modules.health.ocrValidator = true;
      return Object.freeze({ sanitize, toIntStrict });
    })();


    // ═══════════════════════════════════════════════
    // 19. OVERLAY POSITION FIX (naturalWidth Ratio)
    // ───────────────────────────────────────────────
    // AMAÇ: img.getBoundingClientRect() tek başına yetmez.
    //       object-fit, transform, zoom varsa overlay kayar.
    //       naturalWidth/naturalHeight oranı ile düzelt.
    // BAĞIMSIZLIK: Saf yardımcı. Tek başına çalışır.
    // KULLANIM: const pos = Modules.overlayFix.bboxToPixels(bbox, imgEl);
    //          el.style.left = pos.left + 'px';
    // ═══════════════════════════════════════════════
    Modules.overlayFix = (() => {
      // bbox: [ymin, xmin, ymax, xmax], 0-1000 normalize
      // imgEl: <img> elementi
      // Dönüş: ekrandaki gerçek pixel koordinatları (img'in sol-üstüne göre)
      function bboxToPixels(bbox, imgEl) {
        if (!Array.isArray(bbox) || bbox.length !== 4 || !imgEl) {
          return { left: 0, top: 0, width: 0, height: 0, valid: false };
        }
        const [ymin, xmin, ymax, xmax] = bbox.map(n => Math.max(0, Math.min(1000, Number(n) || 0)));

        const rect = imgEl.getBoundingClientRect();
        const nW = imgEl.naturalWidth || 0;
        const nH = imgEl.naturalHeight || 0;

        // naturalWidth henüz yüklenmemişse rect'e düş (eski davranış)
        if (!nW || !nH) {
          return {
            left:  (xmin / 1000) * rect.width,
            top:   (ymin / 1000) * rect.height,
            width: ((xmax - xmin) / 1000) * rect.width,
            height:((ymax - ymin) / 1000) * rect.height,
            valid: true, mode: 'rect-fallback'
          };
        }

        // object-fit: contain mantığı (en yaygın). 
        // img: max-width:100% kullandığında genelde contain davranır.
        const scale = Math.min(rect.width / nW, rect.height / nH);
        const renderedW = nW * scale;
        const renderedH = nH * scale;
        // Görüntü container içinde ortalanıyorsa offset
        const offsetX = (rect.width  - renderedW) / 2;
        const offsetY = (rect.height - renderedH) / 2;

        // BBox normalize edilmiş (0-1000) → naturalWidth oranıyla → renderedW
        const left   = offsetX + (xmin / 1000) * renderedW;
        const top    = offsetY + (ymin / 1000) * renderedH;
        const width  = ((xmax - xmin) / 1000) * renderedW;
        const height = ((ymax - ymin) / 1000) * renderedH;

        return { left, top, width, height, valid: true, mode: 'natural-ratio' };
      }

      Modules.registry.push('overlayFix'); Modules.health.overlayFix = true;
      return Object.freeze({ bboxToPixels });
    })();


    // ═══════════════════════════════════════════════════════════════════
    // ═══════════════════════════════════════════════
    // 20. MIGRATION (IndexedDB Schema Evolution)
    // ───────────────────────────────────────────────
    // AMAÇ: v1 → v2 → v3 DB upgrade'i için sıralı runner.
    //       storage.init içinde otomatik çağrılır.
    //       Her migration idempotent ve önceki schemayı bozmaz.
    // BAĞIMSIZLIK: Tek başına çalışır. storage modülü onu opsiyonel kullanır.
    // KULLANIM: Modules.migration.TARGET_VERSION → storage versiyon hedefi
    //          Modules.migration.list → tüm migration tanımları (debug)
    // YENİ MIGRATION EKLEMEK: MIGRATIONS dizisine yeni obje ekle, TARGET_VERSION++ olur.
    // ═══════════════════════════════════════════════
    Modules.migration = (() => {
      // Her migration: { version: N, name: '...', up: (db, tx) => {...} }
      // 'up' onupgradeneeded içinde sync çağrılır, async olamaz.
      const MIGRATIONS = [
        {
          version: 2,
          name: 'add_indexes_for_lru_cleanup',
          up: (db, tx) => {
            // examCache'e lastAccessed index ekle (LRU eviction için)
            if (db.objectStoreNames.contains('examCache')) {
              const store = tx.objectStore('examCache');
              if (!store.indexNames.contains('lastAccessed')) {
                store.createIndex('lastAccessed', 'lastAccessed', { unique: false });
              }
              if (!store.indexNames.contains('timestamp')) {
                store.createIndex('timestamp', 'timestamp', { unique: false });
              }
            }
          }
        },
        {
          version: 3,
          name: 'telemetry_and_replay_stores',
          up: (db, tx) => {
            // Telemetry kayıtları için ayrı store
            if (!db.objectStoreNames.contains('telemetry')) {
              const ts = db.createObjectStore('telemetry', { keyPath: 'id', autoIncrement: true });
              ts.createIndex('ts', 'ts', { unique: false });
              ts.createIndex('type', 'type', { unique: false });
            }
            // Replay guard için işlenmiş hash kayıtları
            if (!db.objectStoreNames.contains('processedHashes')) {
              const ph = db.createObjectStore('processedHashes', { keyPath: 'hash' });
              ph.createIndex('ts', 'ts', { unique: false });
            }
            // examCache'e revision index (versiyonlama için)
            if (db.objectStoreNames.contains('examCache')) {
              const store = tx.objectStore('examCache');
              if (!store.indexNames.contains('baseId')) {
                store.createIndex('baseId', 'baseId', { unique: false });
              }
            }
          }
        }
      ];

      const TARGET_VERSION = MIGRATIONS.length > 0 ? Math.max(...MIGRATIONS.map(m => m.version)) : 1;

      function run(db, oldVersion, newVersion, tx) {
        const log = (Modules.logger && Modules.logger.info) || console.log;
        const warn = (Modules.logger && Modules.logger.warn) || console.warn;
        log(`Migration: v${oldVersion} → v${newVersion}`);
        const pending = MIGRATIONS.filter(m => m.version > oldVersion && m.version <= newVersion)
                                  .sort((a, b) => a.version - b.version);
        for (const m of pending) {
          try {
            log(`  ↳ apply v${m.version} (${m.name})`);
            m.up(db, tx);
          } catch (err) {
            warn(`  ✗ migration v${m.version} BAŞARISIZ:`, err.message);
            // Birinde fail olursa dur, sonrakileri çalıştırma (data consistency için)
            throw err;
          }
        }
      }

      Modules.registry.push('migration'); Modules.health.migration = true;
      return Object.freeze({ run, TARGET_VERSION, list: () => MIGRATIONS.map(m => ({ version: m.version, name: m.name })) });
    })();


    // ═══════════════════════════════════════════════
    // 21. CACHE JANITOR (IndexedDB LRU Cleanup)
    // ───────────────────────────────────────────────
    // AMAÇ: examCache büyümeyi sınırla.
    //       Limit aşılırsa en eski (lastAccessed) kayıtları sil.
    //       Yaş limiti de var: 30 günden eski kayıtları temizle.
    // BAĞIMSIZLIK: storage v2+ (lastAccessed index) gerekli.
    //              Modülün kendi başına çalışması garantilenmiş;
    //              fallback olarak index yoksa getAll + sort yapar.
    // KULLANIM: await Modules.cacheJanitor.cleanup();          // manuel
    //          Modules.cacheJanitor.schedule();                // otomatik (1 saatte bir)
    //          await Modules.cacheJanitor.stats();             // {count, sizeMb}
    // ═══════════════════════════════════════════════
    Modules.cacheJanitor = (() => {
      const MAX_RECORDS = 200;             // En fazla 200 sınav saklı (öğretmen başına)
      const MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000; // 30 gün
      const STORE = 'examCache';
      let scheduledTimer = null;

      async function cleanup() {
        if (!Modules.storage || !Modules.health.storage) return { ok: false, reason: 'storage_unavailable' };
        const log = Modules.logger;
        try {
          const all = await Modules.storage.getAll(STORE);
          if (!all || all.length === 0) return { ok: true, removed: 0, kept: 0 };

          const now = Date.now();
          let removed = 0;

          // 1) Yaş bazlı temizlik
          const tooOld = all.filter(r => {
            const ts = r.lastAccessed || r.timestamp ? new Date(r.timestamp).getTime() : 0;
            return (now - (r.lastAccessed || ts || now)) > MAX_AGE_MS;
          });
          for (const r of tooOld) {
            try { await Modules.storage.del(STORE, r.id); removed++; }
            catch (err) { if (log) log.warn('Janitor del fail:', err.message); }
          }

          // 2) Sayı bazlı temizlik (LRU: lastAccessed asc)
          const remaining = all.filter(r => !tooOld.includes(r));
          if (remaining.length > MAX_RECORDS) {
            remaining.sort((a, b) => (a.lastAccessed || 0) - (b.lastAccessed || 0));
            const excess = remaining.length - MAX_RECORDS;
            for (let i = 0; i < excess; i++) {
              try { await Modules.storage.del(STORE, remaining[i].id); removed++; }
              catch (err) { if (log) log.warn('Janitor LRU fail:', err.message); }
            }
          }

          const finalCount = (all.length - removed);
          if (log && removed > 0) log.info(`Janitor: ${removed} kayıt temizlendi, ${finalCount} kaldı.`);
          // Telemetry sinyali (varsa)
          if (Modules.telemetry) Modules.telemetry.track('cache.cleanup', { removed, kept: finalCount });
          return { ok: true, removed, kept: finalCount };
        } catch (err) {
          if (log) log.error('Janitor cleanup hatası:', err.message);
          return { ok: false, reason: err.message };
        }
      }

      async function stats() {
        if (!Modules.storage || !Modules.health.storage) return { ok: false };
        try {
          const all = await Modules.storage.getAll(STORE);
          let bytes = 0;
          for (const r of all) bytes += JSON.stringify(r).length;
          return { ok: true, count: all.length, sizeMb: (bytes / 1024 / 1024).toFixed(2) };
        } catch (err) { return { ok: false, reason: err.message }; }
      }

      // Sayfa açıldığında 1 kez + her 1 saatte bir
      function schedule() {
        if (scheduledTimer) return;
        // İlk çağrı 10 sn sonra (boot'u bloklamasın)
        setTimeout(() => cleanup().catch(() => {}), 10000);
        scheduledTimer = setInterval(() => cleanup().catch(() => {}), 60 * 60 * 1000);
      }
      function unschedule() { if (scheduledTimer) { clearInterval(scheduledTimer); scheduledTimer = null; } }

      Modules.registry.push('cacheJanitor'); Modules.health.cacheJanitor = true;
      return Object.freeze({ cleanup, stats, schedule, unschedule });
    })();


    // ═══════════════════════════════════════════════
    // 22. TELEMETRY (Structured Metrics Pipeline)
    // ───────────────────────────────────────────────
    // AMAÇ: 'ocr.success', 'ai.latency_ms', 'cache.hit' gibi yapılandırılmış olaylar.
    //       Buffer'a yazılır, batch olarak IndexedDB'ye gönderilir.
    //       Future: backend POST. Şu an sadece local toplama.
    // BAĞIMSIZLIK: storage v3+ varsa kalıcı, yoksa RAM-only.
    // KULLANIM: Modules.telemetry.track('ocr.success', { confidence: 0.9, ms: 1234 });
    //          Modules.telemetry.timing('ocr.run', async () => doOcr());
    //          await Modules.telemetry.flush();
    //          Modules.telemetry.summary() → metrik özetleri
    // ═══════════════════════════════════════════════
    Modules.telemetry = (() => {
      const BUFFER_MAX = 100;
      const FLUSH_INTERVAL_MS = 30000; // 30 sn
      const buffer = [];
      const counters = new Map();  // type -> count
      const latencies = new Map(); // type -> [ms, ms, ms]
      let flushTimer = null;
      let sessionId = null;

      function getSessionId() {
        if (!sessionId) {
          sessionId = 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        }
        return sessionId;
      }

      function safeDeviceInfo() {
        try {
          const n = (typeof navigator !== 'undefined' ? navigator : {});
          return {
            ua: (n.userAgent || '').slice(0, 200),
            online: !!n.onLine,
            lang: n.language || '',
            cores: n.hardwareConcurrency || 0,
            mem: n.deviceMemory || 0
          };
        } catch { return {}; }
      }

      function track(type, data = {}) {
        if (!type || typeof type !== 'string') return;
        // Sayaç
        counters.set(type, (counters.get(type) || 0) + 1);
        // Latency varsa kaydet
        if (typeof data.ms === 'number') {
          const arr = latencies.get(type) || [];
          arr.push(data.ms);
          if (arr.length > 100) arr.shift();
          latencies.set(type, arr);
        }
        // Buffer'a yaz
        buffer.push({
          ts: Date.now(),
          type,
          data: data || {},
          session: getSessionId()
        });
        if (buffer.length >= BUFFER_MAX) flush().catch(() => {});
      }

      async function timing(type, fn) {
        const t0 = Date.now();
        try {
          const result = await fn();
          track(type, { ms: Date.now() - t0, ok: true });
          return result;
        } catch (err) {
          track(type, { ms: Date.now() - t0, ok: false, err: String(err && err.message || err).slice(0, 200) });
          throw err;
        }
      }

      async function flush() {
        if (buffer.length === 0) return { flushed: 0 };
        const batch = buffer.splice(0, buffer.length);
        if (!Modules.storage || !Modules.health.storage) {
          // Storage yoksa RAM'de bırak (kayıp olur, kabul)
          return { flushed: 0, dropped: batch.length, reason: 'no_storage' };
        }
        // 'telemetry' store v3+ ile geliyor; yoksa sessizce skip
        try {
          const db = Modules.storage.getDb && Modules.storage.getDb();
          if (!db || !db.objectStoreNames.contains('telemetry')) {
            return { flushed: 0, dropped: batch.length, reason: 'no_store' };
          }
          for (const ev of batch) {
            // Cihaz bilgisini ilk event'a koy (tekrar tekrar yazmasın)
            if (ev === batch[0]) ev.device = safeDeviceInfo();
            try { await Modules.storage.put('telemetry', ev); } catch {}
          }
          return { flushed: batch.length };
        } catch (err) {
          return { flushed: 0, dropped: batch.length, reason: err.message };
        }
      }

      function summary() {
        const result = { counters: {}, latencyP50: {}, latencyP95: {} };
        for (const [t, c] of counters.entries()) result.counters[t] = c;
        for (const [t, arr] of latencies.entries()) {
          if (arr.length === 0) continue;
          const sorted = [...arr].sort((a, b) => a - b);
          result.latencyP50[t] = sorted[Math.floor(sorted.length * 0.5)];
          result.latencyP95[t] = sorted[Math.floor(sorted.length * 0.95)];
        }
        return result;
      }

      function start() {
        if (flushTimer) return;
        flushTimer = setInterval(() => flush().catch(() => {}), FLUSH_INTERVAL_MS);
      }
      function stop() { if (flushTimer) { clearInterval(flushTimer); flushTimer = null; } }

      Modules.registry.push('telemetry'); Modules.health.telemetry = true;
      return Object.freeze({ track, timing, flush, summary, start, stop, getSessionId });
    })();


    // ═══════════════════════════════════════════════
    // 23. IMAGE PREP (Preprocessing Pipeline)
    // ───────────────────────────────────────────────
    // AMAÇ: AI'ya gitmeden önce görüntü kalitesini artır.
    //       - autoContrast: histogram stretch (en yaygın kazanım)
    //       - denoise: 3x3 median (kalemlerden gelen noise)
    //       - grayscale: AI tokenı düşürmeye yardımcı (opsiyonel)
    // BAĞIMSIZLIK: Saf canvas işlemleri. Hiçbir modüle bağlı değil.
    // KULLANIM: const enhanced = await Modules.imagePrep.enhance(dataUrl, { autoContrast: true });
    //          const gray = await Modules.imagePrep.toGrayscale(dataUrl);
    // NOT: Perspective correction ve adaptive threshold daha kompleks (corner detection
    //      gerekir) — saha verisi olmadan kuru implementasyon yanlış. Şu an YOK.
    // ═══════════════════════════════════════════════
    Modules.imagePrep = (() => {
      function loadImage(dataUrl) {
        return new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => res(img);
          img.onerror = () => rej(new Error('Görsel yüklenemedi'));
          img.src = dataUrl;
        });
      }
      function toCanvas(img) {
        const c = document.createElement('canvas');
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        return { canvas: c, ctx };
      }

      // Histogram stretch: en koyu pixel 0'a, en açık 255'e gerilir.
      function autoContrast(imgData) {
        const d = imgData.data;
        // Min/max parlaklık
        let min = 255, max = 0;
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          if (lum < min) min = lum;
          if (lum > max) max = lum;
        }
        const range = max - min || 1;
        if (range >= 250) return imgData; // zaten geniş aralık, dokunma
        const scale = 255 / range;
        for (let i = 0; i < d.length; i += 4) {
          d[i]   = Math.max(0, Math.min(255, (d[i]   - min) * scale));
          d[i+1] = Math.max(0, Math.min(255, (d[i+1] - min) * scale));
          d[i+2] = Math.max(0, Math.min(255, (d[i+2] - min) * scale));
        }
        return imgData;
      }

      // 3x3 median denoise — kalem fırlamalarını yumuşatır
      function denoise3x3(imgData) {
        const { data, width, height } = imgData;
        const out = new Uint8ClampedArray(data);
        const wnd = new Array(9);
        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            for (let ch = 0; ch < 3; ch++) {
              let k = 0;
              for (let dy = -1; dy <= 1; dy++)
                for (let dx = -1; dx <= 1; dx++)
                  wnd[k++] = data[((y + dy) * width + (x + dx)) * 4 + ch];
              wnd.sort((a, b) => a - b);
              out[(y * width + x) * 4 + ch] = wnd[4];
            }
          }
        }
        // Alpha kanalını kopyala
        for (let i = 3; i < data.length; i += 4) out[i] = data[i];
        return new ImageData(out, width, height);
      }

      async function enhance(dataUrl, opts = {}) {
        const { autoContrast: ac = true, denoise = false, quality = 0.85 } = opts;
        const img = await loadImage(dataUrl);
        const { canvas, ctx } = toCanvas(img);
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if (ac) imgData = autoContrast(imgData);
        if (denoise) imgData = denoise3x3(imgData);
        ctx.putImageData(imgData, 0, 0);
        const out = canvas.toDataURL('image/jpeg', quality);
        canvas.width = 0; canvas.height = 0;
        return out;
      }

      async function toGrayscale(dataUrl, quality = 0.85) {
        const img = await loadImage(dataUrl);
        const { canvas, ctx } = toCanvas(img);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          d[i] = d[i+1] = d[i+2] = lum;
        }
        ctx.putImageData(imgData, 0, 0);
        const out = canvas.toDataURL('image/jpeg', quality);
        canvas.width = 0; canvas.height = 0;
        return out;
      }

      Modules.registry.push('imagePrep'); Modules.health.imagePrep = true;
      return Object.freeze({ enhance, toGrayscale, autoContrast, denoise3x3 });
    })();


    // ═══════════════════════════════════════════════
    // 24. EXAM VERSION (Revision Tracking)
    // ───────────────────────────────────────────────
    // AMAÇ: Bir sınav birden çok kez kaydedilirse (öğretmen düzeltme yapar),
    //       eski hâli kaybetme. baseId + revision tut.
    //       Aynı baseId'in en yüksek revision'ı "current".
    // BAĞIMSIZLIK: Saf id yardımcısı. storage opsiyonel.
    // KULLANIM: const id = Modules.examVersion.newId();
    //          const rev = await Modules.examVersion.nextRevision('exam_xxx');
    //          const recs = await Modules.examVersion.history('exam_xxx');
    // ═══════════════════════════════════════════════
    Modules.examVersion = (() => {
      // Yeni base ID üret. Format: exam_<timestamp>_<rnd>
      function newId() {
        return 'exam_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      // Bir kayıt için sonraki revision numarasını hesapla
      async function nextRevision(baseId) {
        if (!baseId) return 1;
        if (!Modules.storage || !Modules.health.storage) return 1;
        try {
          const all = await Modules.storage.getAll('examCache');
          const same = all.filter(r => r.baseId === baseId);
          if (same.length === 0) return 1;
          return Math.max(...same.map(r => Number(r.revision) || 1)) + 1;
        } catch { return 1; }
      }

      // Bir kaydı "versioned" formata wrap et
      function wrap(record, baseId, revision) {
        return {
          ...record,
          baseId: baseId || record.baseId || newId(),
          revision: revision || 1,
          // id'yi unique tut: baseId#rev
          id: (baseId || record.baseId || newId()) + '#r' + (revision || 1)
        };
      }

      async function history(baseId) {
        if (!Modules.storage || !Modules.health.storage) return [];
        try {
          const all = await Modules.storage.getAll('examCache');
          return all.filter(r => r.baseId === baseId).sort((a, b) => (a.revision || 0) - (b.revision || 0));
        } catch { return []; }
      }

      async function latest(baseId) {
        const h = await history(baseId);
        return h.length > 0 ? h[h.length - 1] : null;
      }

      Modules.registry.push('examVersion'); Modules.health.examVersion = true;
      return Object.freeze({ newId, nextRevision, wrap, history, latest });
    })();


    // ═══════════════════════════════════════════════
    // 25. REPLAY GUARD (Duplicate Upload Protection)
    // ───────────────────────────────────────────────
    // AMAÇ: Aynı kağıdı 2 kez yüklemeyi önle (image hash bazlı).
    //       Offline queue replay'inde de işine yarar.
    //       SHA-256 (zaten ocr.hashImage'da var) → processedHashes tablosu.
